services:
  - type: web
    name: levy-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: LEVY_API_KEY
        generateValue: true
      - key: MONGODB_DB
        value: Levy
